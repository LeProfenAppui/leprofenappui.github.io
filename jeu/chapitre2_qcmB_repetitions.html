<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM B - Chapitre 2 : Répétitions d'instructions</title>
<style>
:root{
  --bg:#1A1A2E;--surface:#22223A;--surface2:#2C2C4A;
  --text:#F0F0FF;--text2:#B0B0D0;--text3:#7070A0;
  --green:#2E7D32;--green-l:#1B5E20;--green-h:#43A047;
  --orange:#E65100;--orange-l:#BF360C;--orange-h:#EF6C00;
  --red:#B71C1C;--red-l:#7F0000;--red-h:#C62828;
  --accent:#7F77DD;
  --radius:14px;
  font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--text);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem}
.wrap{width:100%;max-width:700px}
.hidden{display:none!important}

/* -- Accueil -- */
.home{text-align:center;padding:2.5rem 1rem}
.home-logo{font-size:4rem;margin-bottom:1rem}
.home h1{font-size:1.8rem;font-weight:600;margin-bottom:.5rem}
.home .source{font-size:12px;color:var(--text3);max-width:480px;margin:0 auto 1.5rem;line-height:1.7}
.home .source strong{color:var(--text2)}
.start-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:14px 36px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s;width:100%}
.start-btn:hover{opacity:.88}

/* -- Barre haut -- */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;gap:12px;flex-wrap:wrap}
.q-label{font-size:13px;color:var(--text3);font-weight:500}
.prog-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.score-badge{background:var(--surface);border:1px solid var(--surface2);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}

/* -- Carte question -- */
.q-card{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;min-height:130px;display:flex;flex-direction:column;justify-content:center}
.q-num{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.6rem}
.q-text{font-size:1.05rem;font-weight:500;color:var(--text);line-height:1.6}
.q-stat{font-size:13px;color:var(--text2);margin-top:.4rem}

/* -- Blocs de code -- */
code, .inline-code{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;background:rgba(255,255,255,.10);padding:2px 7px;border-radius:6px;font-size:.92em;color:#FFD9A0;white-space:nowrap}
.code-block{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;background:#14141F;border:1px solid var(--surface2);border-radius:10px;padding:12px 16px;margin-top:.75rem;font-size:.92em;line-height:1.7;color:#E4E4FF;white-space:pre;overflow-x:auto}
.code-block .kw{color:#7F9CF5}
.code-block .str{color:#A5D6A7}
.code-block .num{color:#FFAB70}

/* -- Reponses -- */
.answers{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
.ans-btn{border:none;border-radius:var(--radius);padding:14px 18px;font-size:15px;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:all .18s;display:flex;align-items:center;gap:12px;color:#fff;position:relative;overflow:hidden}
.ans-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .15s}
.ans-btn:hover:not(:disabled)::before{background:rgba(255,255,255,.08)}
.ans-btn:disabled{cursor:default}
.ans-a{background:var(--green);box-shadow:0 2px 8px rgba(46,125,50,.3)}
.ans-b{background:var(--orange);box-shadow:0 2px 8px rgba(230,81,0,.3)}
.ans-c{background:var(--red);box-shadow:0 2px 8px rgba(183,28,28,.3)}
.ans-a:hover:not(:disabled){background:var(--green-h)}
.ans-b:hover:not(:disabled){background:var(--orange-h)}
.ans-c:hover:not(:disabled){background:var(--red-h)}
.ans-btn.correct{outline:3px solid #fff;opacity:1}
.ans-btn.wrong{opacity:.45}
.ans-letter{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ans-text{flex:1}
.ans-text code{background:rgba(0,0,0,.22);color:#fff}

/* -- Feedback -- */
.feedback{border-radius:var(--radius);padding:12px 16px;font-size:13px;display:flex;align-items:flex-start;gap:10px;line-height:1.55;margin-bottom:1rem}
.feedback.ok{background:#1B5E2055;border:1px solid var(--green);color:#A5D6A7}
.feedback.ko{background:#7F000055;border:1px solid var(--red);color:#EF9A9A}
.fb-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}
.feedback code{background:rgba(0,0,0,.28);color:#fff}
.next-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:opacity .2s;margin-top:4px}
.next-btn:hover{opacity:.88}

/* -- Resultat -- */
.result{text-align:center;padding:2.5rem 1rem}
.res-medal{font-size:5rem;display:block;margin-bottom:.75rem}
.result h2{font-size:1.6rem;font-weight:700;margin-bottom:.4rem}
.res-score{font-size:3rem;font-weight:800;color:var(--accent);margin:.5rem 0}
.result p{color:var(--text2);font-size:14px;margin-bottom:1.5rem}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.rstat{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:12px 8px;text-align:center}
.rstat-val{font-size:1.4rem;font-weight:700;color:var(--text);display:block}
.rstat-lbl{font-size:11px;color:var(--text3)}
.replay-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:opacity .2s}
.replay-btn:hover{opacity:.88}

/* -- Review -- */
.review-item{background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);padding:12px 16px;margin-bottom:10px;text-align:left}
.review-q{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.review-answer{font-size:13px;display:flex;align-items:center;gap:6px}
.review-answer.ok{color:#A5D6A7}
.review-answer.ko{color:#EF9A9A}
.review-answer code{background:rgba(0,0,0,.28);color:#fff}

@media(max-width:480px){.res-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<!-- ACCUEIL -->
<div id="home">
  <div class="home">
    <div class="home-logo">&#128257;</div>
    <h1>Chapitre 2 - QCM B</h1>
    <p class="source">Répétitions d'instructions</p>
    <button class="start-btn" onclick="start()">Lancer le quiz &rarr;</button>
  </div>
</div>

<!-- JEU -->
<div id="game" class="hidden">
  <div class="top-bar">
    <span class="q-label" id="qlabel">1 / 6</span>
    <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <span class="score-badge">&#11088; <span id="sdisp">0</span></span>
  </div>
  <div class="q-card" id="qcard">
    <div class="q-num" id="qnum"></div>
    <div class="q-text" id="qtext"></div>
    <div class="code-block hidden" id="qcode"></div>
    <div class="q-stat" id="qstat"></div>
  </div>
  <div class="answers" id="answers"></div>
  <div id="fb" class="hidden"></div>
  <button class="next-btn hidden" id="next-btn" onclick="nextQ()">Question suivante &rarr;</button>
</div>

<!-- RESULTAT -->
<div id="result" class="hidden result"></div>

</div>

<script>
const QS = [
  {
    "num": "Question 1",
    "text": "Comment appelle-t-on une boucle placée à l'intérieur d'une autre boucle ?",
    "opts": [
      "Une boucle imbriquée",
      "Une boucle infinie",
      "Une boucle double"
    ],
    "ok": 0,
    "expl": "Une boucle imbriquée est une boucle écrite à l'intérieur du bloc d'une autre boucle.",
    "stat": "Chapitre 2 — Répétitions d'instructions",
    "plaintext": "Comment appelle-t-on une boucle dans une boucle ?"
  },
  {
    "num": "Question 2",
    "text": "Combien de fois le symbole <code>*</code> est-il affiché par ce programme ?",
    "opts": [
      "7 fois",
      "10 fois",
      "2 fois"
    ],
    "ok": 1,
    "expl": "La boucle interne (5 tours) s'exécute pour chaque tour de la boucle externe (2 tours) : 2 x 5 = 10 affichages.",
    "stat": "Chapitre 2 — Répétitions d'instructions",
    "code": "for x in range(2):\n    for y in range(5):\n        print(\"*\")",
    "plaintext": "Combien de fois print(\"*\") s'exécute-t-il dans ces boucles imbriquées ?"
  },
  {
    "num": "Question 3",
    "text": "Dans l'écriture <code>for i in range(N):</code>, à quoi correspond N ?",
    "opts": [
      "Au nom de la variable de boucle",
      "Au nombre de répétitions de la boucle",
      "Au type des données affichées"
    ],
    "ok": 1,
    "expl": "N représente le nombre de répétitions : <code>range(N)</code> génère N valeurs, donc N tours de boucle.",
    "stat": "Chapitre 2 — Répétitions d'instructions",
    "plaintext": "Que représente N dans for i in range(N): ?"
  },
  {
    "num": "Question 4",
    "text": "Dans les exemples vus en cours, la valeur du compteur de boucle (i, k...) sert-elle systématiquement dans un calcul ?",
    "opts": [
      "Oui, elle est toujours utilisée dans un calcul",
      "Non, elle sert souvent uniquement à compter les tours",
      "Cela dépend de la couleur choisie pour la variable"
    ],
    "ok": 1,
    "expl": "Le compteur sert avant tout à faire tourner la boucle le bon nombre de fois ; il n'est pas forcément réutilisé dans un calcul.",
    "stat": "Chapitre 2 — Répétitions d'instructions",
    "plaintext": "Le compteur de boucle sert-il toujours dans un calcul ?"
  },
  {
    "num": "Question 5",
    "text": "Ce programme devait afficher <code>Ok</code> 5 fois, mais il ne l'affiche que 3 fois. Que faut-il corriger ?",
    "opts": [
      "La valeur écrite dans <code>range()</code>",
      "Le nom de la variable de boucle",
      "Les guillemets autour de \"Ok\""
    ],
    "ok": 0,
    "expl": "Le nombre de répétitions dépend de la valeur passée à <code>range()</code> : il faut la remplacer par 5.",
    "stat": "Chapitre 2 — Répétitions d'instructions",
    "code": "for i in range(3):\n    print(\"Ok\")",
    "plaintext": "Le programme affiche Ok 3 fois au lieu de 5. Que faut-il corriger ?"
  },
  {
    "num": "Question 6",
    "text": "Qu'affiche ce programme ?",
    "opts": [
      "<code>Ok</code>, trois fois, chacun sur une ligne",
      "<code>Ok Ok Ok </code> sur la même ligne, séparés par des espaces",
      "<code>OkOkOk</code> collés, sans espace"
    ],
    "ok": 1,
    "expl": "<code>end=\" \"</code> remplace le retour à la ligne par défaut par un espace : le mot s'affiche donc à la suite, trois fois, sur la même ligne.",
    "stat": "Chapitre 2 — Répétitions d'instructions",
    "code": "for i in range(3):\n    print(\"Ok\", end=\" \")",
    "plaintext": "Qu'affiche for i in range(3): print(\"Ok\", end=\" \") ?"
  }
];

let idx=0, score=0, ok=0, ko=0, answered=false, userAnswers=[];

function start(){
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  loadQ();
}

function loadQ(){
  answered=false;
  const q=QS[idx];
  document.getElementById('qlabel').textContent=(idx+1)+' / '+QS.length;
  document.getElementById('prog').style.width=((idx)/QS.length*100)+'%';
  document.getElementById('sdisp').textContent=score;
  document.getElementById('qnum').textContent=q.num;
  document.getElementById('qtext').innerHTML=q.text;
  const qcode=document.getElementById('qcode');
  if(q.code){ qcode.innerHTML=q.code; qcode.classList.remove('hidden'); }
  else { qcode.innerHTML=''; qcode.classList.add('hidden'); }
  document.getElementById('qstat').textContent=q.stat;
  document.getElementById('fb').className='hidden';
  document.getElementById('fb').innerHTML='';
  document.getElementById('next-btn').classList.add('hidden');

  const letters=['A','B','C'];
  const colors=['ans-a','ans-b','ans-c'];
  document.getElementById('answers').innerHTML=q.opts.map((o,i)=>
    `<button class="ans-btn ${colors[i]}" onclick="answer(${i},this)">
      <span class="ans-letter">${letters[i]}</span>
      <span class="ans-text">${o}</span>
    </button>`
  ).join('');
}

function answer(i,el){
  if(answered) return;
  answered=true;
  const q=QS[idx];
  const isOk=(i===q.ok);
  document.querySelectorAll('.ans-btn').forEach(b=>b.disabled=true);
  if(isOk){
    el.classList.add('correct');
    document.querySelectorAll('.ans-btn').forEach((b,j)=>{if(j!==i) b.classList.add('wrong')});
    score+=100; ok++;
    showFb('ok','&#9989;','Correct !',q.expl);
  } else {
    el.classList.add('wrong');
    const correctEl=document.querySelectorAll('.ans-btn')[q.ok];
    correctEl.classList.add('correct');
    document.querySelectorAll('.ans-btn').forEach((b,j)=>{if(j!==q.ok&&j!==i) b.classList.add('wrong')});
    ko++;
    showFb('ko','&#10060;','Raté ! La bonne réponse était : '+q.opts[q.ok],q.expl);
  }
  userAnswers.push({q:q.plaintext||q.text,chose:q.opts[i],correct:q.opts[q.ok],ok:isOk});
  document.getElementById('sdisp').textContent=score;
  document.getElementById('next-btn').classList.remove('hidden');
  if(idx+1===QS.length) document.getElementById('next-btn').textContent='Voir les résultats &rarr;';
}

function showFb(type,icon,title,detail){
  const el=document.getElementById('fb');
  el.className=`feedback ${type}`;
  el.innerHTML=`<span class="fb-icon">${icon}</span><div><strong>${title}</strong><br><span style="font-size:12px">${detail}</span></div>`;
}

function nextQ(){
  idx++;
  if(idx>=QS.length){endGame();return;}
  loadQ();
}

function endGame(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('prog').style.width='100%';
  const pct=ok/QS.length;
  const medal=pct===1?'&#129351;':pct>=.8?'&#129352;':pct>=.6?'&#129353;':'&#128218;';
  const title=pct===1?'Score parfait !':pct>=.8?'Excellent !':pct>=.6?'Bien joué !':'À retravailler !';
  const msg=pct===1?'Tu maîtrises parfaitement cette partie du cours.':
            pct>=.6?'Tu as de bonnes bases, continue comme ça.':
            'Relis le cours et recommence le QCM !';
  const r=document.getElementById('result');
  r.classList.remove('hidden');
  r.innerHTML=`
<span class="res-medal">${medal}</span>
<h2>${title}</h2>
<div class="res-score">${score} pts</div>
<p>${msg}</p>
<div class="res-grid">
  <div class="rstat"><span class="rstat-val">${ok}/${QS.length}</span><span class="rstat-lbl">Bonnes réponses</span></div>
  <div class="rstat"><span class="rstat-val">${ko}</span><span class="rstat-lbl">Erreurs</span></div>
  <div class="rstat"><span class="rstat-val">${Math.round(pct*100)} %</span><span class="rstat-lbl">Score</span></div>
</div>
<div style="text-align:left;margin-bottom:1.5rem">
  <p style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:.75rem">Récapitulatif</p>
  ${userAnswers.map(a=>`
  <div class="review-item">
    <div class="review-q">${a.q}</div>
    <div class="review-answer ${a.ok?'ok':'ko'}">${a.ok?'&#10003;':'&#10007;'} ${a.chose}${!a.ok?' &rarr; Bonne réponse : '+a.correct:''}</div>
  </div>`).join('')}
</div>
<button class="replay-btn" onclick="replay()">&#8635; Rejouer</button>`;
}

function replay(){
  idx=0;score=0;ok=0;ko=0;answered=false;userAnswers=[];
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('sdisp').textContent=0;
  document.getElementById('prog').style.width='0%';
  loadQ();
}
</script>
</body>
</html>
